<div class="task-list-container">

  <div class="header-section">
    <h1>To Do List</h1>
  </div>

  <div *ngIf="error$ | async as error" class="error-banner">
    <mat-icon>warning</mat-icon>
    <span>{{ error }}</span>
  </div>

  <app-task-form [task]="selectedTask" (saved)="onTaskSaved()"></app-task-form>

  <div class="search-bar">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Search tasks</mat-label>
      <input matInput placeholder="Start typing..." [(ngModel)]="searchText" (input)="filterTasks()">
      <mat-icon matSuffix color="primary">search</mat-icon>
    </mat-form-field>
  </div>

  <div *ngIf="loading$ | async">
    Loading...
  </div>

  <div *ngIf="error$ | async as error">
    {{ error }}
  </div>

  <div class="stats-container">
    <div class="stat-item total">
      <mat-icon>list</mat-icon>
      <span>Total: <strong>{{ (filteredTasks$  | async)?.length }}</strong></span>
    </div>
    <div class="stat-item done">
      <mat-icon>check_circle</mat-icon>
      <span>Done: <strong>
          {{
            getDoneTasksCount(
              (filteredTasks$ | async) || []
            )
          }}
        </strong>
      </span>
    </div>
    <button mat-flat-button color="warn" (click)="deleteAll()">
      <mat-icon>delete_sweep</mat-icon>
      Delete all
    </button>
  </div>

  <div class="tasks-grid">
    <app-task-item
      *ngFor="let task of filteredTasks$ | async"
      [task]="task"
      (delete)="onDelete($event)"
      (edit)="onEdit($event)">
    </app-task-item>
  </div>

</div>
