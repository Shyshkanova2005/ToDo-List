<div class="task-form">
  <h2>{{ task ? 'Edit Task' : 'New Task' }}</h2>

  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="title" name="title">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Description</mat-label>
    <textarea matInput [(ngModel)]="description" name="description"></textarea>
  </mat-form-field>

  <div class="form-row">
    <mat-form-field appearance="outline">
      <mat-label>Deadline</mat-label>
      <input matInput [matDatepicker]="picker" [min]="minDate" [(ngModel)]="deadline" name="deadline">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="status" name="status">
        <mat-option [value]="TaskStatus.Todo">To Do</mat-option>
        <mat-option [value]="TaskStatus.InProgress">In Progress</mat-option>
        <mat-option [value]="TaskStatus.Done">Done</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="btn-wrapper">
    <button mat-flat-button color="primary" (click)="saveTask()">
      Save Task
    </button>
  </div>
</div>
